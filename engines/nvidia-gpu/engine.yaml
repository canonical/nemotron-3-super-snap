name: nvidia-gpu
description: Optimized for inference on Nvidia GPUs, using CUDA
vendor: Canonical Ltd
grade: stable
devices:
  allof:
    - type: gpu
      vendor-id: 0x10de # Nvidia Corporation
  anyof: 
    - type: cpu
      architecture: amd64
    - type: cpu
      architecture: arm64

# This is just a wild guess. It depends on how much llama-server uses when
# offloading the model to the GPU and the available vRAM.
memory: 10G

# The usage will be higher if considering snapd snapshots.
disk-space: 78G

